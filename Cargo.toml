[package]
name = "pqpfs"
version = "0.1.0"
edition = "2021"
description = "Post-Quantum Perfect Forward Secrecy"

[dependencies]
serde = { version = "1.0.215", features = ["derive"] }
base32 = "0.5.1"
bincode = "1.3.3"
bzip2 = "0.4.4"
t16 = "0.0.1"
og-enum-to-string = "0.1.0"
pqpfs-macros = { path = "./pqpfs-macros" }
flate2 = "1.0.34"
gzip = "0.1.2"
iocore = "2.3.2"
sanitation = "1.0.3"
otpauth = "0.5.1"
rand = "0.8.5"
rsa = { version = "0.9.6", features = ["pkcs5", "serde", "sha2"] }
ed25519 = { version = "2.2.3", features = ["serde", "pem", "pkcs8"] }
pkcs8 = { version = "0.10.2", features = ["des-insecure", "std", "pkcs5", "3des"] }
pkcs5 = { version = "0.7.1", features = ["des-insecure", "3des"] }
crypto-common = { version = "0.1.6", features = ["std", "rand_core"] }
security-framework = { version = "3.0.0", features = ["OSX_10_13", "log"] }
hex = "0.4.3"
chrono = { version = "0.4.38", features = ["serde"] }
chacha20 = { version = "0.9.1", features = ["std", "zeroize"] }
kdbx-rs = "=0.5.2"
quote = "1.0.37"
keccak = "0.1.5"
ascon = "0.4.0"
sequoia-openpgp = "1.21.2"
buffered-reader = "1.3.1"
cipher = "0.4.4"
num-bigint = { version = "0.4.6", features = ["serde", "rand"] }
num-traits = "0.2.19"
num-integer = "0.1.46"
cbc = { version = "0.1.2", features = ["alloc", "std", "zeroize"] }
des = { version = "0.8.1", features = ["zeroize"] }
rustls = { version = "0.23.21", default-features = false, features = ["ring", "std"] }
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa-core", "serde"] }
elliptic-curve = { version = "0.13.8", features = ["std", "serde", "pem", "pkcs8", "sec1", "ecdh", "alloc", "hash2curve"] }
p384 = { version = "0.13.0", features = ["serde"] }
generic-array = { version = "1.1.1", features = ["alloc", "serde", "zeroize"] }
pgp = "0.14.2"
sha3 = "0.10.8"

[dev-dependencies]
clap = { version = "4.5.20", features = ["derive", "env", "string", "unicode", "wrap_help"] }
trybuild = "1.0.101"
tryexpand = "0.9.2"

# [profile.dev]
# debug = true
# lto = true
# overflow-checks = true
# panic = "unwind"
# strip = false

# [profile.release]
# lto = true
# overflow-checks = true
# panic = "unwind"
# strip = true

# [profile.bench]
# debug = true
# lto = true
# overflow-checks = true
# strip = false

# [profile.test]
# debug = true
# lto = true
# overflow-checks = true
# strip = false

[lib]
bench = false
doctest = false
name = "pqpfs"
path = "poc/lib.rs"

[[bench]]
name = "drop"
path = "tests/bench_poc_drop.rs"
